<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Calling Card</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --dark-btn: #0f172a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --icon-bg: #f8fafc;
      --icon-border: #e2e8f0;
      --primary-accent: #0284c7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

    .app-container {
      width: 100%; max-width: 420px; background: var(--card-bg); min-height: 100vh;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08); position: relative; overflow: hidden; padding-bottom: 30px;
    }

    /* Hero Banner */
    .hero-banner { position: relative; width: 100%; height: 220px; overflow: hidden; background: #0f172a; }
    .banner-img { width: 100%; height: 100%; object-fit: cover; }
    .hero-banner::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 45px;
      background: var(--card-bg); border-top-left-radius: 40px; border-top-right-radius: 40px;
    }

    /* Profile Header */
    .profile-header { position: relative; margin-top: -65px; padding: 0 24px; text-align: center; z-index: 10; }
    .avatar-wrapper {
      width: 110px; height: 110px; margin: 0 auto 12px; border-radius: 50%; padding: 4px;
      background: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.12); overflow: hidden;
    }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #e2e8f0; }

    .name { font-size: 1.5rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    .title { font-size: 0.88rem; font-weight: 500; color: var(--text-muted); margin-top: 2px; }

    /* CTA Buttons */
    .cta-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; }
    .btn-dark {
      background: var(--dark-btn); color: #ffffff; border: none; padding: 10px 18px;
      border-radius: 30px; font-size: 0.82rem; font-weight: 600; display: inline-flex;
      align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); cursor: pointer;
    }
    .btn-dark:active { transform: scale(0.96); }

    /* Social Row */
    .social-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 24px 0 26px; flex-wrap: wrap; padding: 0 16px; }
    .social-circle {
      width: 44px; height: 44px; border-radius: 50%; background: var(--icon-bg); border: 1px solid var(--icon-border);
      display: inline-flex; align-items: center; justify-content: center; color: #475569; text-decoration: none; font-size: 1.1rem; transition: all 0.2s;
    }
    .social-circle:hover { background: #ffffff; color: #1877f2; border-color: #1877f2; transform: translateY(-2px); }
    .social-circle.viber:hover { color: #7360f2; border-color: #7360f2; }

    /* Schedule Section */
    .section-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); padding: 0 24px; text-align: left; margin-bottom: 12px; }
    .schedule-controls { display: flex; align-items: center; gap: 6px; padding: 0 24px; margin-bottom: 14px; }
    .month-dropdown {
      background: #f8fafc; border: 1px solid var(--icon-border); padding: 6px 14px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;
    }
    .nav-arrow-btn {
      width: 32px; height: 32px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--icon-border);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; font-size: 0.75rem;
    }

    .date-scroll-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 24px 8px; scrollbar-width: none; }
    .date-scroll-list::-webkit-scrollbar { display: none; }
    .date-pill {
      min-width: 62px; height: 72px; border-radius: 16px; background: #f8fafc; border: 1px solid var(--icon-border);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    }
    .date-pill .day-number { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
    .date-pill .day-text { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); }
    .date-pill.active { background: var(--dark-btn); border-color: var(--dark-btn); }
    .date-pill.active .day-number { color: #ffffff; }
    .date-pill.active .day-text { color: #94a3b8; }

    /* Portfolio Masonry */
    .portfolio-masonry { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 24px; margin-top: 14px; }
    .masonry-card { border-radius: 20px; overflow: hidden; background: #e2e8f0; display: block; cursor: pointer; text-decoration: none; }
    .masonry-card:nth-child(odd) { height: 185px; }
    .masonry-card:nth-child(even) { height: 145px; }
    .masonry-card img { width: 100%; height: 100%; object-fit: cover; }

    /* QR Footer */
    .qr-footer {
      display: flex; align-items: center; justify-content: space-between; margin: 28px 24px 0;
      padding: 16px; background: #f8fafc; border-radius: 20px; border: 1px solid var(--icon-border);
    }
    .qr-footer p { font-size: 0.8rem; font-weight: 700; color: var(--text-main); }
    .qr-footer span { font-size: 0.72rem; color: var(--text-muted); }
    #qrcode { background: #fff; padding: 4px; border-radius: 8px; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark-btn); color: white; padding: 10px 20px; border-radius: 30px;
      font-size: 0.82rem; font-weight: 600; transition: 0.25s ease; opacity: 0; z-index: 100;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Hero Banner -->
    <div class="hero-banner">
      <img id="bannerImg" src="" class="banner-img" alt="Cover">
    </div>

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img id="avatarImg" src="" alt="Avatar" class="avatar-img">
      </div>

      <h1 class="name" id="fullName">Loading...</h1>
      <p class="title" id="jobTitle"></p>

      <div class="cta-row">
        <button class="btn-dark" id="btnSave"><i class="fa-regular fa-bell"></i> Save Contact</button>
        <a href="#" id="emailBtn" class="btn-dark"><i class="fa-regular fa-envelope"></i> Email</a>
        <a href="#" id="phoneBtn" class="btn-dark"><i class="fa-solid fa-phone"></i> Call</a>
      </div>
    </div>

    <!-- Social Row (Auto hides if empty in data.json) -->
    <div class="social-row">
      <a href="#" id="fbLink" target="_blank" rel="noopener noreferrer" class="social-circle" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" id="viberLink" class="social-circle viber" title="Viber"><i class="fa-brands fa-viber"></i></a>
      <a href="#" id="igLink" target="_blank" rel="noopener noreferrer" class="social-circle" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" id="tgLink" target="_blank" rel="noopener noreferrer" class="social-circle" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
      <a href="#" id="liLink" target="_blank" rel="noopener noreferrer" class="social-circle" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="#" id="waLink" target="_blank" rel="noopener noreferrer" class="social-circle" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <!-- Schedule -->
    <div class="section-title">Schedule</div>
    <div class="schedule-controls">
      <div class="month-dropdown"><span>November 2024</span><i class="fa-solid fa-chevron-down" style="font-size: 0.65rem;"></i></div>
      <div style="flex: 1;"></div>
      <div class="nav-arrow-btn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="nav-arrow-btn"><i class="fa-solid fa-chevron-right"></i></div>
    </div>

    <div class="date-scroll-list">
      <div class="date-pill active" onclick="selectDate(this)"><span class="day-number">24</span><span class="day-text">Nov</span></div>
      <div class="date-pill" onclick="selectDate(this)"><span class="day-number">25</span><span class="day-text">Nov</span></div>
      <div class="date-pill" onclick="selectDate(this)"><span class="day-number">26</span><span class="day-text">Nov</span></div>
      <div class="date-pill" onclick="selectDate(this)"><span class="day-number">27</span><span class="day-text">Nov</span></div>
      <div class="date-pill" onclick="selectDate(this)"><span class="day-number">28</span><span class="day-text">Nov</span></div>
    </div>

    <!-- Featured Works -->
    <div class="section-title" style="margin-top: 24px;">Featured Works</div>
    <div class="portfolio-masonry" id="galleryContainer"></div>

    <!-- QR Footer -->
    <div class="qr-footer">
      <div>
        <p>Direct NFC Card Link</p>
        <span>Instant camera scan</span>
      </div>
      <div id="qrcode"></div>
    </div>

  </div>

  <div id="toast">Saved!</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // CACHE BUSTER: laging bago ang kukunin na data.json
    const API_URL = "./data.json?v=" + new Date().getTime();

    let clientDataGlobal = {};

    // Helper: Gumagana sa uploaded file sa GitHub o Google Drive
    function formatImagePath(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('drive.google.com')) {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return 'https://drive.google.com/thumbnail?sz=w800&id=' + match[1];
      }
      return url;
    }

    // Function para itago ang icon kapag blangko sa data.json
    function bindSocialLink(elementId, url) {
      const el = document.getElementById(elementId);
      if (url && url.trim() !== "") {
        el.href = url;
        el.style.display = "inline-flex";
      } else {
        el.style.display = "none";
      }
    }

    // Basahin ang sariling API (data.json)
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        clientDataGlobal = data;

        document.getElementById('fullName').innerText = data.FullName || 'Your Name';
        document.getElementById('jobTitle').innerText = data.Title || '';
        document.title = (data.FullName || 'Digital Card') + " - Calling Card";

        // Photos (Uploaded image man o link)
        document.getElementById('avatarImg').src = formatImagePath(data.PhotoURL);
        document.getElementById('bannerImg').src = formatImagePath(data.BannerURL);

        // Buttons
        document.getElementById('emailBtn').href = 'mailto:' + (data.Email || '');
        document.getElementById('phoneBtn').href = 'tel:' + (data.Phone || '');

        // Social Links (Auto-hide kung empty)
        bindSocialLink('fbLink', data.Facebook);
        bindSocialLink('igLink', data.Instagram);
        bindSocialLink('tgLink', data.Telegram);
        bindSocialLink('liLink', data.LinkedIn);

        if (data.WhatsAppNumber) {
          const cleanWa = data.WhatsAppNumber.replace(/[^0-9]/g, '');
          bindSocialLink('waLink', 'https://wa.me/' + cleanWa);
        } else {
          document.getElementById('waLink').style.display = "none";
        }

        if (data.ViberNumber) {
          bindSocialLink('viberLink', 'viber://chat?number=' + encodeURIComponent(data.ViberNumber));
        } else {
          document.getElementById('viberLink').style.display = "none";
        }

        // Render Gallery
        const galleryEl = document.getElementById('galleryContainer');
        galleryEl.innerHTML = '';
        if (data.Gallery && data.Gallery.length > 0) {
          data.Gallery.forEach(item => {
            const card = document.createElement('a');
            card.className = 'masonry-card';
            card.href = item.link || '#';
            card.target = '_blank';
            card.innerHTML = `<img src="${formatImagePath(item.image)}" alt="${item.title || 'Work'}" loading="lazy">`;
            galleryEl.appendChild(card);
          });
        }
      })
      .catch(err => {
        console.error("Error reading data.json:", err);
      });

    // 1-Click Save vCard
    document.getElementById('btnSave').addEventListener('click', function() {
      const c = clientDataGlobal;
      const vCard = [
        'BEGIN:VCARD', 'VERSION:3.0',
        'FN:' + (c.FullName || ''),
        'ORG:' + (c.Company || ''),
        'TITLE:' + (c.Title || ''),
        'TEL;TYPE=CELL,VOICE:' + (c.Phone || ''),
        'TEL;TYPE=VIBER:' + (c.ViberNumber || ''),
        'EMAIL;TYPE=WORK,INTERNET:' + (c.Email || ''),
        'ADR;TYPE=WORK:;;' + (c.Address || '') + ';;;',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8;' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', (c.FullName || 'Contact').replace(/[^a-zA-Z0-9]/g, '_') + '.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Contact saved!');
    });

    function selectDate(el) {
      document.querySelectorAll('.date-pill').forEach(pill => pill.classList.remove('active'));
      el.classList.add('active');
      showToast('Selected: ' + el.innerText.replace('\n', ' '));
    }

    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 48, height: 48, colorDark: "#0f172a", colorLight: "#ffffff"
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
